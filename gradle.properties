# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft/loader/Fabric-API/mcp-toolkit versions all come from the com.mattmc.mcmod convention
# plugin (mcmodding/gradle-conventions/) and are deliberately NOT repeated here.
#
# To PIN this repo to something different, set the key here and it wins over the plugin's default:
#   minecraft_version / loader_version / fabric_version / mcptoolkit_version
#
# Pinned here, ahead of the plugin's defaults, because this repo tracks the newest 26.2 build and
# the plugin is the whole workspace's answer -- bumping it there would move five sibling mods that
# have not been rebuilt against these. Drop these two lines once the plugin catches up.
loader_version=0.19.5
fabric_version=0.159.0+26.2

# The mcp-toolkit bridge port for THIS repo's dev game, and the one number an agent session must
# agree with: .mcp.json here sets MCPTK_URL=http://127.0.0.1:25645 to match. Without it every
# project's game takes the dev default 25599, the second one to boot loses the bind after 90
# seconds of silent retrying, and its session drives the FIRST game instead.
#
# The workbench's allocation, which is a list precisely because nothing enforces it:
#   25640 mcmodding  25641 menagerie  25642 rocketeer  25643 nijntje  25644 herbarium
#   25645 hydrarium
mcmod.port=25645

# Mod
mod_version=0.1.0
maven_group=com.mattjesmc.hydrarium
archives_base_name=hydrarium
junit_version=5.11.4
